# Unlok deployment config for LibreChat.
# See https://www.librechat.ai/docs/configuration/librechat_yaml for the full schema.

version: 1.3.14
cache: true

endpoints:
  custom:
    - name: 'Unlok'
      apiKey: '${UNLOK_API_KEY}'
      baseURL: '${UNLOK_BASE_URL}'
      models:
        default:
          - 'anthropic/claude-sonnet-5'
          - 'openai/gpt-5'
          - 'gemini/gemini-2.5-pro'
          - 'groq/llama-3.3-70b-versatile'
        fetch: false
      titleConvo: true
      titleModel: 'anthropic/claude-sonnet-5'
      modelDisplayLabel: 'Unlok'
